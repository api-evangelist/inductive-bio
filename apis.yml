aid: inductive-bio
name: Inductive Bio
description: >-
  Inductive Bio is an AI-powered virtual lab for small molecule drug discovery, based in New York and
  founded in 2022 by Josh Haimson and Ben Birnbaum (both formerly of Flatiron Health). The company pairs
  medicinal chemists with machine learning to run millions of in silico ADMET (Absorption, Distribution,
  Metabolism, Excretion, Toxicity) experiments, surface the strongest compound hypotheses, and accelerate
  the path to development candidates. Its Beacon-1 models took first place in both the 2025 Polaris/ASAP
  and 2026 OpenADMET/ExpansionRx blind ADMET competitions, and are delivered through the Compass software
  platform (with the Indy AI chemistry assistant) and an Embedded Experts services offering. Inductive Bio
  operates a pre-competitive ADMET data consortium, is SOC 2 compliant, and is backed by a16z, Lux Capital,
  Bessemer Venture Partners, Obvious Ventures, Character, and S32. Compass is enterprise/partner software;
  it exposes an API to partner teams but publishes no public, self-serve developer portal, OpenAPI, or SDK.
